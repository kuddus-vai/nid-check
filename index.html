<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NID Server Copy - Bangladesh Election Commission</title>
    <meta name="description" content="NID verification slip and server copy layout viewer based on Bangladesh Election Commission NIDW specifications." />
    <meta property="og:title" content="NID Server Copy - Bangladesh Election Commission" />
    <meta property="og:description" content="NID verification slip and server copy layout viewer based on Bangladesh Election Commission NIDW specifications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <div id="root">
      <div id="initial-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f1f5f9; color: #1e293b;">
        <div style="width: 44px; height: 44px; border: 3px solid #cbd5e1; border-top-color: #0b5330; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <p style="font-size: 14px; font-weight: 600; color: #0f172a; margin: 0 0 4px 0;">বাংলাদেশ নির্বাচন কমিশন - সার্ভার কপি লেআউট</p>
        <p style="font-size: 12px; color: #64748b; margin: 0;">ডেটা লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var splash = document.getElementById('initial-splash');
        if (splash) {
          splash.innerHTML = '<div style="max-width: 500px; padding: 20px; background: #fff; border: 1px solid #fca5a5; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); color: #991b1b; font-family: sans-serif;">' +
            '<h3 style="margin-top: 0; font-size: 16px; font-weight: bold;">লোড করতে সমস্যা হয়েছে</h3>' +
            '<p style="font-size: 13px; color: #374151;">' + (e.message || 'Script error occurred while initializing') + '</p>' +
            '<button onclick="location.reload()" style="background: #2563eb; color: #fff; border: none; padding: 6px 14px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 10px;">Reload</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
